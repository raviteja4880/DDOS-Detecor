[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-ddos-detector"
version = "0.1.0"
description = "Educational distributed DDoS detection prototype with explainable rules and safe lab-only mitigation"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.4.5,<2.6.0",
    "PyYAML>=6.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]
